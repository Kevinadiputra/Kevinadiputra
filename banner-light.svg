<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient (Light) -->
    <linearGradient id="banner-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Animated Shimmer Gradient for Name (Light) -->
    <linearGradient id="banner-light-shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="25%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1200 0"
        to="1200 0"
        dur="6s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="banner-light-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" />
    </filter>

    <filter id="banner-light-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Grid Pattern (Light) -->
    <pattern id="banner-light-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.2" fill="#cbd5e1" />
    </pattern>

    <!-- Laser Sweep Gradient (Light) -->
    <linearGradient id="banner-light-laser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <style>
      <![CDATA[
        @keyframes blPulse {
          0%, 100% { opacity: 0.9; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.92); }
        }
        @keyframes blBlink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }
        @keyframes blScan {
          0% { transform: translateY(-480px); }
          100% { transform: translateY(480px); }
        }
        @keyframes blCycle1 {
          0%, 28% { opacity: 1; transform: translateY(0); }
          33%, 95% { opacity: 0; transform: translateY(-8px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes blCycle2 {
          0%, 28% { opacity: 0; transform: translateY(8px); }
          33%, 61% { opacity: 1; transform: translateY(0); }
          66%, 100% { opacity: 0; transform: translateY(-8px); }
        }
        @keyframes blCycle3 {
          0%, 61% { opacity: 0; transform: translateY(8px); }
          66%, 95% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(8px); }
        }
        .bl-pulse { animation: blPulse 2.4s ease-in-out infinite; }
        .bl-cursor { animation: blBlink 0.9s infinite; }
        .bl-scanline { animation: blScan 5.5s linear infinite; }
        .bl-role-1 { animation: blCycle1 9s ease-in-out infinite; }
        .bl-role-2 { animation: blCycle2 9s ease-in-out infinite; }
        .bl-role-3 { animation: blCycle3 9s ease-in-out infinite; }
      ]]>
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="480" rx="14" fill="url(#banner-light-bg)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="480" rx="14" fill="url(#banner-light-grid)" />

  <!-- Ambient Blurred Glow Elements (Light Mode) -->
  <circle cx="200" cy="120" r="170" fill="#38bdf8" opacity="0.12" filter="url(#banner-light-blur)" />
  <circle cx="1020" cy="220" r="180" fill="#a855f7" opacity="0.10" filter="url(#banner-light-blur)" />
  <circle cx="580" cy="400" r="140" fill="#34d399" opacity="0.08" filter="url(#banner-light-blur)" />

