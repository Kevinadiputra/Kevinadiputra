      <text x="0" y="28" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Machine Learning &amp; Data Scientist</text>
      <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5">Universitas Sriwijaya · Palembang, ID</text>
    </g>
  </g>

  <!-- Technical Dossier Details -->
  <g transform="translate(32, 162)">
    <rect width="456" height="136" rx="6" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />

    <!-- Spec Row 1 -->
    <g transform="translate(16, 26)">
      <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="600">01 / AFFILIATION</text>
      <text x="140" y="0" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600">GDGoC Universitas Sriwijaya (Project Officer &amp; ML Core)</text>
    </g>
    <line x1="16" y1="36" x2="440" y2="36" stroke="#1e293b" stroke-width="0.8" />

    <!-- Spec Row 2 -->
    <g transform="translate(16, 56)">
