<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Card Background -->
    <linearGradient id="lanyard-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Header Accent -->
    <linearGradient id="lanyard-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="lanyard-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Card Frame -->
  <rect width="520" height="380" rx="10" fill="url(#lanyard-bg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="520" height="380" rx="10" fill="url(#lanyard-grid)" />

  <!-- Top Decorative Header Strip -->
  <g transform="translate(32, 28)">
    <text x="0" y="10" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.1em">ENGINEERING PASSPORT // VERIFIED</text>
    <text x="456" y="10" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="end">ID: KA-2026-ENG</text>
    <line x1="0" y1="20" x2="456" y2="20" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Profile Identity Section -->
  <g transform="translate(32, 70)">
    <!-- Avatar Tech Monogram Frame -->
    <rect width="68" height="68" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <circle cx="34" cy="34" r="26" fill="#080c14" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2" />
    <text x="34" y="41" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="-0.02em">KA</text>

    <!-- Identity Headers -->
    <g transform="translate(86, 12)">
