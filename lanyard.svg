      <rect x="9" y="0" width="1" height="24" />
      <rect x="12" y="0" width="4" height="24" />
      <rect x="18" y="0" width="2" height="24" />
      <rect x="22" y="0" width="5" height="24" />
      <rect x="29" y="0" width="1" height="24" />
      <rect x="32" y="0" width="3" height="24" />
      <rect x="37" y="0" width="2" height="24" />
      <rect x="41" y="0" width="4" height="24" />
      <rect x="47" y="0" width="1" height="24" />
      <rect x="50" y="0" width="5" height="24" />
      <rect x="57" y="0" width="2" height="24" />
      <rect x="61" y="0" width="3" height="24" />
      <rect x="66" y="0" width="2" height="24" />
      <rect x="70" y="0" width="4" height="24" />
