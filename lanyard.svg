      <text x="140" y="0" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600">PT Pupuk Sriwidjaja (Data Science &amp; Remote Sensing)</text>
    </g>
    <line x1="16" y1="66" x2="440" y2="66" stroke="#1e293b" stroke-width="0.8" />

    <!-- Spec Row 3 -->
