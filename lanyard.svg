      <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="600">03 / SPECIALIZATION</text>
      <text x="140" y="0" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600">Predictive ML, Spatial Analytics, Automated ETL</text>
    </g>
    <line x1="16" y1="96" x2="440" y2="96" stroke="#1e293b" stroke-width="0.8" />

    <!-- Spec Row 4 -->
    <g transform="translate(16, 116)">
      <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="600">04 / AVAILABILITY</text>
      <text x="140" y="0" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">Open for Full-Time, Contract, &amp; Research Roles</text>
