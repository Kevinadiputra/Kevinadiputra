          <tspan fill="#e6edf3">&#160;&#160;&#160;&#160;r2_score = self.model.score(X_val, y_val)</tspan>
        </text>
        <!-- Line 11 -->
        <text x="0" y="216">
          <tspan fill="#ff7b72">&#160;&#160;&#160;&#160;if</tspan> <tspan fill="#e6edf3">r2_score &gt;=</tspan> <tspan fill="#79c0ff">0.85</tspan>:
