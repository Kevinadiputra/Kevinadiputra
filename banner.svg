<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="60%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Node Card Fill -->
    <linearGradient id="banner-node-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.95" />
    </linearGradient>

    <!-- Technical Hairline Grid -->
    <pattern id="banner-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>

    <style>
      <![CDATA[
        @keyframes signalFlow {
          from { stroke-dashoffset: 40; }
          to { stroke-dashoffset: 0; }
        }
        .b-signal {
          stroke-dasharray: 4 6;
          animation: signalFlow 2s linear infinite;
        }
      ]]>
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="440" rx="10" fill="url(#banner-bg)" stroke="#1e293b" stroke-width="1" />
  <rect width="1200" height="440" rx="10" fill="url(#banner-grid)" />

