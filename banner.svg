    <text x="544" y="38" fill="#f1f5f9" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">50+ Runs (MLflow Registry)</text>

    <line x1="800" y1="10" x2="800" y2="38" stroke="#1e293b" stroke-width="1" />

    <!-- Metric Item 4 -->
