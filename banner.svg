    <circle cx="44" cy="17" r="4.5" fill="#10b981" opacity="0.8" />

    <!-- Active Tab -->
    <path d="M 68 8 L 200 8 A 4 4 0 0 1 204 12 L 204 34 L 64 34 L 64 12 A 4 4 0 0 1 68 8 Z" fill="#0d1117" />
