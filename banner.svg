      <text x="380" y="18" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500">âš¡ GDGoC Unsri Core Team</text>
    </g>

    <!-- Verified Metrics Bar -->
