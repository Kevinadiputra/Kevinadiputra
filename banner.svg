      <!-- Metric 1 -->
      <text x="24" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">RÂ² = 0.87</text>
      <text x="24" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500">PT Pusri Carbon Model</text>

      <line x1="170" y1="14" x2="170" y2="52" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

      <!-- Metric 2 -->
      <text x="194" y="28" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">100%</text>
      <text x="194" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500">ETL Pytest Coverage</text>

