      <!-- Pill 1: Location -->
      <rect x="0" y="0" width="154" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500">ðŸ“ Palembang, ID</text>

