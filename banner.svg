    <text x="0" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.025em">
      Kevin Adiputra Mahesa
    </text>

