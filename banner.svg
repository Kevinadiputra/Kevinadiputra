<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Animated Shimmer Gradient for Name -->
    <linearGradient id="banner-shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1200 0"
        to="1200 0"
        dur="6s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="banner-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <filter id="banner-code-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.18" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="banner-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Laser Sweep Gradient -->
    <linearGradient id="banner-laser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <style>
      <![CDATA[
        @keyframes bannerPulse {
          0%, 100% { opacity: 0.85; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.92); }
        }
        @keyframes bannerBlink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }
        @keyframes bannerScan {
          0% { transform: translateY(-480px); }
          100% { transform: translateY(480px); }
        }
        @keyframes bannerCycle1 {
          0%, 28% { opacity: 1; transform: translateY(0); }
          33%, 95% { opacity: 0; transform: translateY(-8px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes bannerCycle2 {
          0%, 28% { opacity: 0; transform: translateY(8px); }
          33%, 61% { opacity: 1; transform: translateY(0); }
          66%, 100% { opacity: 0; transform: translateY(-8px); }
        }
        @keyframes bannerCycle3 {
          0%, 61% { opacity: 0; transform: translateY(8px); }
          66%, 95% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(8px); }
        }
        .b-pulse { animation: bannerPulse 2.4s ease-in-out infinite; }
        .b-cursor { animation: bannerBlink 0.9s infinite; }
        .b-scanline { animation: bannerScan 5.5s linear infinite; }
        .b-role-1 { animation: bannerCycle1 9s ease-in-out infinite; }
        .b-role-2 { animation: bannerCycle2 9s ease-in-out infinite; }
        .b-role-3 { animation: bannerCycle3 9s ease-in-out infinite; }
      ]]>
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="480" rx="14" fill="url(#banner-bg)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="480" rx="14" fill="url(#banner-grid)" />

  <!-- Ambient Blurred Glow Elements -->
  <circle cx="220" cy="140" r="180" fill="#0284c7" opacity="0.14" filter="url(#banner-blur)" />
  <circle cx="1020" cy="240" r="190" fill="#6366f1" opacity="0.12" filter="url(#banner-blur)" />
  <circle cx="580" cy="420" r="150" fill="#10b981" opacity="0.08" filter="url(#banner-blur)" />

  <!-- Laser Scanline Sweeper -->
