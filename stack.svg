        <rect x="92" y="0" width="78" height="20" rx="4" fill="#1e293b" />
        <text x="131" y="13.5" fill="#f1f5f9" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" text-anchor="middle">TensorFlow</text>

        <rect x="176" y="0" width="68" height="20" rx="4" fill="#1e293b" />
        <text x="210" y="13.5" fill="#f1f5f9" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" text-anchor="middle">XGBoost</text>

