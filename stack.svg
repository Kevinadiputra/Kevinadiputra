<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="orbit-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e1626" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Core Orb Gradient -->
    <linearGradient id="orbit-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="orbit-core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbit-satellite-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="orbit-grid-pat" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <style>
      <![CDATA[
        @keyframes orbitSpin1 {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes orbitSpin2 {
          from { transform: rotate(360deg); }
          to { transform: rotate(0deg); }
        }
        @keyframes orbitSpin3 {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes orbitCorePulse {
          0%, 100% { transform: scale(1); opacity: 0.95; }
          50% { transform: scale(1.06); opacity: 0.8; }
        }
        .orbit-spin-inner {
          transform-origin: 185px 190px;
          animation: orbitSpin1 18s linear infinite;
        }
        .orbit-spin-mid {
          transform-origin: 185px 190px;
          animation: orbitSpin2 28s linear infinite;
        }
        .orbit-spin-outer {
          transform-origin: 185px 190px;
          animation: orbitSpin3 38s linear infinite;
        }
        .orbit-core-pulse {
          transform-origin: 185px 190px;
          animation: orbitCorePulse 3s ease-in-out infinite;
        }
      ]]>
    </style>
  </defs>

  <!-- Base Canvas Frame -->
  <rect width="680" height="380" rx="14" fill="url(#orbit-bg-grad)" stroke="#1e293b" stroke-width="1" />
  <rect width="680" height="380" rx="14" fill="url(#orbit-grid-pat)" />

  <!-- ==================== LEFT: ATOMIC ORBITAL SYSTEM ==================== -->
  <!-- Ambient Orbit Center Glow -->
  <circle cx="185" cy="190" r="130" fill="#0284c7" opacity="0.08" filter="url(#orbit-core-glow)" />

  <!-- Orbit Path Ellipses (Dashed Rings) -->
  <g stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity="0.55">
    <!-- Inner Orbit Track -->
    <ellipse cx="185" cy="190" rx="68" ry="46" />
    <!-- Middle Orbit Track -->
    <ellipse cx="185" cy="190" rx="112" ry="76" />
    <!-- Outer Orbit Track -->
    <ellipse cx="185" cy="190" rx="156" ry="106" />
  </g>

  <!-- Central Atomic Core -->
  <g class="orbit-core-pulse">
    <circle cx="185" cy="190" r="32" fill="#030712" stroke="#38bdf8" stroke-width="2" />
    <circle cx="185" cy="190" r="26" fill="url(#orbit-core-grad)" opacity="0.85" filter="url(#orbit-core-glow)" />
    <!-- Core Icon / Glyphs -->
    <text x="185" y="186" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">AI / ML</text>
    <text x="185" y="198" fill="#bae6fd" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="600" text-anchor="middle">CORE</text>
  </g>

  <!-- Inner Orbit Satellites (Speed: 18s) -->
  <g class="orbit-spin-inner">
    <!-- Satellite 1: Python (angle ~0deg) -->
    <g transform="translate(253, 190)" filter="url(#orbit-satellite-glow)">
      <circle cx="0" cy="0" r="14" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Py</text>
    </g>

    <!-- Satellite 2: PyTorch / TF (angle ~180deg) -->
    <g transform="translate(117, 190)" filter="url(#orbit-satellite-glow)">
      <circle cx="0" cy="0" r="14" fill="#0b1329" stroke="#f97316" stroke-width="1.5" />
      <text x="0" y="4" fill="#f97316" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="bold" text-anchor="middle">TF</text>
    </g>
  </g>

  <!-- Middle Orbit Satellites (Speed: 28s Counter-Clockwise) -->
  <g class="orbit-spin-mid">
    <!-- Satellite 3: Scikit-Learn (angle ~60deg) -->
    <g transform="translate(241, 124)" filter="url(#orbit-satellite-glow)">
      <circle cx="0" cy="0" r="15" fill="#0b1329" stroke="#34d399" stroke-width="1.5" />
      <text x="0" y="4" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="bold" text-anchor="middle">SKL</text>
    </g>

    <!-- Satellite 4: Docker (angle ~200deg) -->
    <g transform="translate(80, 216)" filter="url(#orbit-satellite-glow)">
      <circle cx="0" cy="0" r="15" fill="#0b1329" stroke="#60a5fa" stroke-width="1.5" />
      <text x="0" y="4" fill="#60a5fa" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="bold" text-anchor="middle">DOC</text>
    </g>

    <!-- Satellite 5: MLflow (angle ~320deg) -->
    <g transform="translate(270, 241)" filter="url(#orbit-satellite-glow)">
      <circle cx="0" cy="0" r="15" fill="#0b1329" stroke="#a78bfa" stroke-width="1.5" />
      <text x="0" y="4" fill="#a78bfa" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="bold" text-anchor="middle">MLF</text>
    </g>
  </g>

  <!-- Outer Orbit Satellites (Speed: 38s Clockwise) -->
  <g class="orbit-spin-outer">
    <!-- Satellite 6: FastAPI -->
    <g transform="translate(341, 190)" filter="url(#orbit-satellite-glow)">
      <circle cx="0" cy="0" r="15" fill="#0b1329" stroke="#2dd4bf" stroke-width="1.5" />
      <text x="0" y="4" fill="#2dd4bf" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="bold" text-anchor="middle">API</text>
    </g>

    <!-- Satellite 7: GeoPandas / GIS -->
    <g transform="translate(75, 115)" filter="url(#orbit-satellite-glow)">
      <circle cx="0" cy="0" r="15" fill="#0b1329" stroke="#f59e0b" stroke-width="1.5" />
      <text x="0" y="4" fill="#f59e0b" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="bold" text-anchor="middle">GIS</text>
    </g>

    <!-- Satellite 8: CI/CD GitHub Actions -->
    <g transform="translate(29, 190)" filter="url(#orbit-satellite-glow)">
      <circle cx="0" cy="0" r="15" fill="#0b1329" stroke="#f43f5e" stroke-width="1.5" />
      <text x="0" y="4" fill="#f43f5e" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="bold" text-anchor="middle">CI</text>
    </g>
  </g>

  <!-- Orbit Section Bottom Label -->
  <g transform="translate(185, 345)">
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#0c192c" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="4" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.06em">3-TIER TECH SATELLITES</text>
  </g>

  <!-- Divider Line -->
  <line x1="365" y1="24" x2="365" y2="356" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />

  <!-- ==================== RIGHT: CAPABILITY MATRIX ==================== -->
  <g transform="translate(385, 36)">
    <!-- Section Title -->
    <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.1em">ENGINEERING ARSENAL</text>
    <text x="0" y="32" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.01em">Specialized Capabilities</text>

    <!-- Category 1: Machine Learning & Deep Learning -->
    <g transform="translate(0, 52)">
      <text x="0" y="10" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">01. PREDICTIVE ML &amp; DEEP LEARNING</text>
      <!-- Pills -->
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="80" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="40" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">Scikit-Learn</text>

        <rect x="86" y="0" width="76" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="124" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">TensorFlow</text>

        <rect x="168" y="0" width="62" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="199" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">XGBoost</text>

        <rect x="236" y="0" width="40" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="256" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">CNN</text>
      </g>
    </g>

    <!-- Category 2: MLOps & Production Systems -->
    <g transform="translate(0, 116)">
      <text x="0" y="10" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">02. MLOPS &amp; DEPLOYMENT PIPELINES</text>
      <!-- Pills -->
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="60" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="30" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">MLflow</text>

        <rect x="66" y="0" width="56" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="94" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">Docker</text>

        <rect x="128" y="0" width="58" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="157" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">FastAPI</text>

        <rect x="192" y="0" width="84" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="234" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">CI/CD Actions</text>
      </g>
    </g>

    <!-- Category 3: Spatial GIS & Automated ETL -->
    <g transform="translate(0, 180)">
      <text x="0" y="10" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">03. SPATIAL DATA SCIENCE &amp; ETL</text>
      <!-- Pills -->
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="58" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="29" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">Pandas</text>

        <rect x="64" y="0" width="76" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="102" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">GeoPandas</text>

        <rect x="146" y="0" width="50" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="171" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">Folium</text>

        <rect x="202" y="0" width="74" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="239" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">Streamlit</text>
      </g>
    </g>

    <!-- Bottom KPI Card -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="276" height="60" rx="8" fill="#080c14" stroke="#1e293b" stroke-width="1" />
      <g transform="translate(16, 18)">
        <text x="0" y="12" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Production Ready</text>
        <text x="0" y="28" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">Models · APIs · Automated Workflows</text>
      </g>
    </g>
  </g>
</svg>
