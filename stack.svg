<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="stack-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Card Frame -->
  <rect width="620" height="380" rx="10" fill="url(#stack-bg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="620" height="380" rx="10" fill="url(#stack-grid)" />

  <!-- Top Header Strip -->
  <g transform="translate(32, 28)">
    <text x="0" y="10" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.1em">PRODUCTION STACK &amp; CAPABILITIES</text>
    <text x="556" y="10" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="end">4 CORE TIERS</text>
